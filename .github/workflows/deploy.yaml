
name: Build and Deploy Spring Boot Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    # Temporary services used only during CI testing
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: product_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d product_catalog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Java 21 and Maven dependency caching
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Run tests against temporary PostgreSQL and Redis
      - name: Run Maven tests
        run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/product_catalog
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      # 4. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and publish Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/redis-product-catalog:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/redis-product-catalog:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      # 7. Connect to EC2 and deploy
      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/redis-product-catalog

            echo "Pulling latest Spring Boot image..."
            sudo docker compose pull app

            echo "Starting PostgreSQL and Redis..."
            sudo docker compose up -d postgres redis

            echo "Deploying Spring Boot application..."
            sudo docker compose up -d app

            echo "Checking container status..."
            sudo docker compose ps

            echo "Cleaning unused Docker images..."
            sudo docker image prune -f
