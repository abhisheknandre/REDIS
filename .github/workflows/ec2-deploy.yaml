name: Test and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: product_catalog
          POSTGRES_USER: postgres
          # NOT A REAL PASSWORD: a throwaway database that exists only during the test run
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d product_catalog"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_PASSWORD: ci_password    # must match the throwaway password above; REDIS_PASSWORD stays unset on purpose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run tests
        run: mvn -B clean verify

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          # >>> SECRET <<< GitHub > Settings > Secrets > EC2_SSH_KEY (private key, including BEGIN/END lines)
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          # >>> SECRET <<< GitHub secret EC2_HOST (your Elastic IP)
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Run deploy script on the server
        env:
          HOST: ${{ secrets.EC2_HOST }}
          # >>> SECRET <<< GitHub secret EC2_USER (ec2-user)
          SSH_USER: ${{ secrets.EC2_USER }}
          # GitHub VARIABLE (not secret) APP_DIR, for example /home/ec2-user/REDIS
          APP_DIR: ${{ vars.APP_DIR }}
        run: |
          # DB and Redis passwords are NOT sent from GitHub: they are read from the .env already on the server
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" "APP_DIR='$APP_DIR' bash -s" < scripts/deploy.sh